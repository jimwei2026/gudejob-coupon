<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F7F2EA">
<title>菇的JOB3.0领券指南</title>
<link rel="stylesheet" href="css/app.css?v=202611121203">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand"><p class="series">菇的JOB!</p></div>
    <div class="topbar-actions">
      <button class="pill" id="btn-gallery" type="button" aria-label="打开图鉴">图鉴 <b id="gallery-count">0/7</b></button>
      <button class="icon-btn" id="btn-mute" type="button" aria-label="静音" aria-pressed="false">
        <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor"/><path d="M15.5 8.6a4.6 4.6 0 0 1 0 6.8M18 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor"/><path d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">

    <!-- S1 选卡 -->
    <section class="screen" id="s-pick" data-screen="pick" aria-label="挑一张激活卡">
      <!-- 招聘 App 的样子：页头 → 转轮 → 秃秃 HR 对话卡 -->
      <div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="激活卡转轮，左右拨动选择">
        <div class="runner" aria-hidden="true">
          <i class="tutu-ground"></i>
          <div class="tutu" id="tutu">
            <div class="tutu-body">
              <img class="t-front" src="assets/tutu/front.png" alt="" draggable="false">
              <img class="t-turn" src="assets/tutu/turn.png" alt="" draggable="false">
              <img class="t-wave" src="assets/tutu/wave.png" alt="" draggable="false">
            </div>
            <i class="sweat"></i>
            <span class="tutu-say"></span>
          </div>
        </div>
        <div class="wheel-track" id="wheel-track"></div>
        <button class="wheel-arrow prev" id="wheel-prev" type="button" aria-label="上一张">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="wheel-arrow next" id="wheel-next" type="button" aria-label="下一张">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="hr-card">
        <div class="hr-top">
          <span class="hr-ava"><img src="assets/tutu/front.png" alt=""></span>
          <div class="hr-who"><b>秃秃 HR</b><span><i></i>刚刚活跃</span></div>
          <span class="hr-tag" id="hr-tag"></span>
        </div>
        <p class="hr-msg" id="hr-msg" aria-live="polite">人，左右拨一拨，挑一张看看谁来上岗</p>
        <button class="btn" id="btn-pick" type="button" disabled>立即沟通</button>
      </div>
      <button class="link rules-link" type="button" data-open="rules">领券规则</button>
    </section>

    <!-- S2 刮卡 / S3 揭晓 -->
    <section class="screen" id="s-scratch" data-screen="scratch" aria-label="刮开激活卡" hidden>
      <div class="head">
        <h1 class="title" id="scratch-title">用手指刮开激活卡</h1>
        <p class="sub" id="scratch-sub">刮开 70% 就会自动翻开</p>
      </div>
      <div class="scratch-area" id="scratch-area">
        <div class="scratch-card" id="scratch-card">
          <img class="scratch-front" id="scratch-front" alt="" draggable="false">
          <div class="burst" aria-hidden="true"></div>
          <div class="finger-hint" aria-hidden="true"><i></i></div>
          <div class="hidden-badge" aria-hidden="true">隐藏款</div>
          <div class="holo" aria-hidden="true"></div>
          <div class="card-hint" aria-hidden="true"><i></i>点卡片，看 TA 的角色 PV</div>
        </div>
      </div>
      <div class="scratch-foot" id="scratch-foot">
        <div class="meter" aria-hidden="true"><i id="scratch-meter"></i></div>
        <button class="link" id="btn-flip" type="button">直接翻开</button>
      </div>
      <div class="reveal-foot" id="reveal-foot" hidden>
        <div class="actions">
          <button class="btn" id="btn-to-coupon" type="button">领取接 TA 回家券</button>
        </div>
      </div>
    </section>

    <!-- S4 领券 -->
    <section class="screen" id="s-coupon" data-screen="coupon" aria-label="领取接 TA 回家券" hidden>
      <div class="coupon-scroll">
        <div class="result">
          <span class="result-card-wrap" id="result-card-wrap"><img class="result-card" id="result-card" alt=""><i class="holo"></i></span>
          <div class="result-text">
            <p class="result-name" id="result-name"></p>
            <p class="result-meta"><span class="tag-hidden" id="result-hidden" hidden>隐藏款</span><span id="result-count"></span></p>
            <p class="result-fortune"><span>今日运势</span><b id="result-fortune"></b></p>
          </div>
        </div>

        <div class="ticket" role="group" aria-label="接 TA 回家券">
          <div class="ticket-amt"><b><small>¥</small><span id="c-amount"></span></b><span>立减</span></div>
          <div class="ticket-info">
            <strong id="c-name"></strong>
            <span id="c-threshold"></span>
            <span id="c-validity"></span>
            <span id="c-store"></span>
          </div>
          <!-- 领券：直接在券上选渠道 -->
          <div class="ticket-go">
            <button class="ch-btn" type="button" data-channel="douyin"><svg class="ch-ico douyin" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#161823"/><g transform="translate(5 5) scale(.92)"><path fill="#25F4EE" transform="translate(-.7 -.7)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/><path fill="#FE2C55" transform="translate(.7 .7)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/><path fill="#fff" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></g></svg><span>抖音领券</span></button>
            <button class="ch-btn" type="button" data-channel="tmall"><span class="ch-mark tmall" aria-hidden="true"><svg viewBox="0 0 75 17.25" aria-hidden="true">  <path style="fill:#ffffff;fill-opacity:1;stroke-width:0.137672" d="m 20.185397,0.07523113 c -1.028728,-0.036564 -2.066926,0.8255486 -2.031056,1.91931747 -0.01681,4.9359981 0.0086,9.8722144 -0.0124,14.8082114 0.84921,0.01272 1.696161,0.0078 2.54327,0.0078 0.004,-4.506315 -0.0062,-9.0104843 0.0065,-13.5168003 0.931195,0.7408053 1.801502,1.5963592 2.898755,2.0874184 1.71735,0.7979717 3.766696,0.820964 5.500857,0.056858 1.158201,-0.4804784 2.063829,-1.3801699 3.039164,-2.1442758 -0.0064,4.5063196 -0.002,9.0104847 -0.002,13.5167997 0.847109,0 1.694308,0.0023 2.53931,-0.004 -0.01453,-4.944311 0.01011,-9.8890164 -0.01087,-14.8313606 0.03567,-1.40114857 -1.683835,-2.37875107 -2.86516,-1.65274447 C 30.71975,1.0527381 29.793117,1.9777644 28.735804,2.7312857 27.539757,3.5504221 25.915136,3.6627225 24.611894,3.038317 23.235146,2.3059489 22.215204,1.0507568 20.882521,0.25278543 c -0.223079,-0.1123126 -0.459723,-0.169058 -0.697122,-0.177495 z m 25.198333,0.029172 c -1.127822,-0.035679 -2.271893,0.6024153 -2.726201,1.67210957 -2.183986,5.0016123 -4.328322,10.0240823 -6.497596,15.0341603 0.924887,0 1.847789,-0.0018 2.772676,0.0025 0.805071,-1.813943 1.549569,-3.655449 2.375664,-5.45882 l 0.10679,-0.06773 c 2.600194,-0.04444 5.202666,-0.004 7.802851,-0.01681 0.786156,1.841475 1.603727,3.670557 2.366763,5.522611 0.931188,0.03386 1.862252,0.01456 2.793443,0.01878 C 52.255099,11.858158 50.11344,6.9115561 47.979903,1.9628614 47.656191,1.1543052 46.989643,0.48959153 46.15304,0.23982643 c -0.249875,-0.082942 -0.509048,-0.1267428 -0.76931,-0.134975 z m -45.36155348,0.010381 c -0.002103,0.85088931 -0.002103,1.70163797 -0.002103,2.55464007 2.27227578,-0.00422 4.54669008,0.011108 6.81896608,-0.00792 0.018897,4.7095141 0.024942,9.4185228 -0.00448,14.1259218 0.8555173,0.03599 1.7109828,0.03403 2.5665063,0.0025 -0.018897,-4.711634 -           </div>
        </div>
        <p class="price" id="c-price" hidden></p>

        <div class="actions row">
          <button class="btn outline" id="btn-pv-again" type="button">再看 PV</button>
          <button class="btn outline" id="btn-again" type="button">再刮一张</button>
        </div>
        <div class="fine">
          <button class="link" type="button" data-open="rules">领券规则</button>
          <p>页面小游戏结果，与实体盲盒款式概率无关</p>
        </div>
      </div>
    </section>
  </main>

  <!-- PV 播放器 -->
  <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="pv-title">
    <div class="pv-top">
      <button class="icon-btn dark" id="pv-back" type="button" aria-label="返回卡片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="pv-title" id="pv-title"></p>
      <button class="pv-speed" id="pv-speed" type="button" aria-label="播放速度 1 倍，点击切换">1x</button>
    </div>
    <div class="pv-frame">
      <video id="pv-video" playsinline webkit-playsinline preload="auto"></video>
      <div class="pv-loader" id="pv-loader" hidden><i></i><span>加载中</span></div>
      <button class="pv-play" id="pv-play" type="button" aria-label="播放" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      </button>
      <button class="pv-unmute" id="pv-unmute" type="button" hidden>点开声音</button>
      <div class="pv-error" id="pv-error" hidden>
        <p>视频没加载出来，券不受影响</p>
        <button class="btn light" id="pv-error-skip" type="button">直接领券</button>
      </div>
      <div class="pv-bar"><i id="pv-bar-fill"></i></div>
    </div>
    <button class="pv-strip" id="pv-strip" type="button">
      <span class="pv-strip-tag">券</span>
      <span id="pv-strip-text">接 TA 回家券已备好</span>
      <span class="pv-strip-go">跳过，直接领</span>
    </button>
  </div>

  <!-- 跳转 -->
  <div class="jump" id="jump" hidden role="dialog" aria-modal="true" aria-labelledby="jump-title">
    <div class="jump-pocket"><img id="jump-fig" alt=""></div>
    <p class="jump-title" id="jump-title">券已到手</p>
    <p class="jump-sub" id="jump-sub"></p>
    <div class="jump-bar" aria-hidden="true"><i></i></div>
    <div class="jump-fallback" id="jump-fallback" hidden>
      <p>没跳过去？复制链接，到 <b id="jump-app"></b> 里打开</p>
      <code id="jump-url"></code>
      <div class="actions row">
        <button class="btn outline" id="jump-copy" type="button">复制链接</button>
        <button class="btn outline" id="jump-retry" type="button">再试一次</button>
      </div>
      <button class="link" id="jump-close" type="button">返回</button>
    </div>
  </div>

  <!-- 底部弹层 -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet-gallery" hidden role="dialog" aria-modal="true" aria-labelledby="g-title">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="g-title">菇的 JOB 图鉴 <span id="g-count"></span></h2>
    <p class="sheet-sub" id="g-sub">点亮的秃秃可以再看一次 TA 的 PV</p>
    <div class="gallery" id="gallery"></div>
    <div class="actions">
      <button class="btn" id="g-again" type="button">再刮一张</button>
      <button class="link" type="button" data-close>关闭</button>
    </div>
  </div>
  <div class="sheet" id="sheet-rules" hidden role="dialog" aria-modal="true" aria-labelledby="r-title">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="r-title">领券规则</h2>
    <ul class="rules" id="rules"></ul>
    <div class="actions"><button class="btn" type="button" data-close>知道了</button></div>
  </div>
  <div class="sheet" id="sheet-leave" hidden role="dialog" aria-modal="true" aria-labelledby="l-title">
    <div class="grab" aria-hidden="true"></div>
    <img class="leave-fig" id="leave-fig" alt="">
    <h2 id="l-title"></h2>
    <p class="sheet-sub">券已经在你手上，随时可以回来用</p>
    <div class="actions">
      <button class="btn" id="leave-stay" type="button">接 TA 回家</button>
      <button class="link" id="leave-go" type="button">下次再说</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="js/config.js?v=202611121203"></script>
<script src="js/sfx-data.js?v=202611121203"></script>
<script src="js/audio.js?v=202611121203"></script>
<script src="js/store.js?v=202611121203"></script>
<script src="js/wheel.js?v=202611121203"></script>
<script src="js/runner.js?v=202611121203"></script>
<script src="js/fx.js?v=202611121203"></script>
<script src="js/scratch.js?v=202611121203"></script>
<script src="js/player.js?v=202611121203"></script>
<script src="js/app.js?v=202611121203"></script>
</body>
</html>
